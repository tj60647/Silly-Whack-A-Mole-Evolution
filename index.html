
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Silly Whack-A-Mole Evolution</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      background-color: #0f172a;
    }
    .font-arcade {
      font-family: 'Bungee', cursive;
    }
    @keyframes bounce-gentle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .animate-bounce-gentle {
      animation: bounce-gentle 2s infinite ease-in-out;
    }
    .dirt-pattern {
      background-image: radial-gradient(#3f2b1d 10%, transparent 10%);
      background-size: 20px 20px;
    }
    @keyframes whack-flash {
      0% { background-color: rgba(255, 255, 255, 0); }
      50% { background-color: rgba(255, 255, 255, 0.5); }
      100% { background-color: rgba(255, 255, 255, 0); }
    }
    .whack-flash {
      animation: whack-flash 0.2s ease-out;
    }
  </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "react": "https://esm.sh/react@^19.2.3",

    "react-dom": "https://esm.sh/react-dom@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
<body class="text-white">
  <div id="root"></div>
  <!-- Boot the application -->
  <script type="module" src="index.tsx"></script>
</body>
</html>
